<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>女優 × 男優 合作關聯圖</title>
<style>
:root {
  /* 淺色：薰衣草紙感，節點用深靛與洋紅，面板是半透明白玻璃 */
  --bg: #f5f3fb;
  --bg-glow-a: rgba(124, 92, 255, .16);
  --bg-glow-b: rgba(236, 72, 153, .11);
  --panel: rgba(255, 255, 255, .68);
  --panel-solid: #ffffff;
  --sheen: rgba(255, 255, 255, .75);
  --text: #1c1730;
  --muted: #5f5879;
  --line: rgba(83, 58, 150, .16);
  --accent: #6a3df0;
  --accent-2: #2d86f5;
  --ring: rgba(106, 61, 240, .22);
  --bar: #8b5cf6;
  --bar-b: #c4b5fd;
  --track: rgba(83, 58, 150, .16);
  --label: #2a2442;
  --halo: rgba(245, 243, 251, .92);
  --pink: #e83e8c;
  --pink-label: #b0136a;
  --soft: rgba(106, 61, 240, .08);
  --soft-2: rgba(106, 61, 240, .14);
  --shadow: 0 1px 0 rgba(255, 255, 255, .8) inset, 0 14px 40px -14px rgba(62, 32, 130, .32), 0 2px 6px rgba(62, 32, 130, .06);
  --r: 16px;
  --r-sm: 10px;
  --dur: 180ms;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --font: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", "Yu Gothic", "Hiragino Sans", system-ui, sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"] {
  /* 深色：深夜的觀星台。背景是靛藍到近黑的漸層，節點像會發光的星體 */
  --bg: #090817;
  --bg-glow-a: rgba(112, 82, 255, .24);
  --bg-glow-b: rgba(255, 80, 165, .13);
  --panel: rgba(20, 17, 42, .62);
  --panel-solid: #15122b;
  --sheen: rgba(255, 255, 255, .06);
  --text: #f3f0ff;
  --muted: #a9a2c9;
  --line: rgba(190, 175, 255, .16);
  --accent: #a595ff;
  --accent-2: #6fd0ff;
  --ring: rgba(165, 149, 255, .28);
  --bar: #8f7bff;
  --bar-b: #ff7ab8;
  --track: rgba(190, 175, 255, .18);
  --label: #efeaff;
  --halo: rgba(9, 8, 23, .9);
  --pink: #ff5fa8;
  --pink-label: #ff9ccb;
  --soft: rgba(165, 149, 255, .12);
  --soft-2: rgba(165, 149, 255, .2);
  --shadow: 0 1px 0 rgba(255, 255, 255, .06) inset, 0 18px 48px -16px rgba(0, 0, 0, .7), 0 2px 8px rgba(0, 0, 0, .3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background:
    radial-gradient(1100px 760px at 78% -12%, var(--bg-glow-a), transparent 62%),
    radial-gradient(900px 700px at -6% 108%, var(--bg-glow-b), transparent 58%),
    var(--bg);
  color: var(--text);
  font: 14px/1.5 var(--font);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
canvas#gl, canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
canvas#gl { z-index: 0; pointer-events: none; }
canvas#c { z-index: 1; touch-action: none; }

.panel {
  position: fixed;
  z-index: 3;
  background: linear-gradient(180deg, var(--sheen), transparent 46%), var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: var(--shadow);
  -webkit-backdrop-filter: blur(18px) saturate(1.35);
  backdrop-filter: blur(18px) saturate(1.35);
}
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#card { left: 16px; top: 16px; padding: 12px 16px 12px; max-width: min(400px, calc(100vw - 100px)); }
#card h1 { margin: 0; font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; }
#date {
  font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.15; letter-spacing: .01em;
  background: linear-gradient(100deg, var(--accent) 0%, var(--pink) 100%);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
  width: fit-content;
}
#work { font-size: 13px; color: var(--muted); min-height: 2.9em; margin-top: 2px; }
#work b { color: var(--text); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
#work .a { color: var(--pink-label); font-weight: 600; }

#tools { right: 16px; top: 16px; display: flex; gap: 4px; padding: 5px; border-radius: 14px; z-index: 26; }
button, select {
  font: inherit;
  color: var(--text);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  height: 36px;
  cursor: pointer;
  touch-action: manipulation;
  transition: border-color var(--dur) var(--ease), background-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease), transform var(--dur) var(--ease), color var(--dur) var(--ease);
}
button { min-width: 36px; padding: 0 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
button:hover, select:hover { border-color: var(--accent); background: var(--soft); }
button:active { transform: scale(.96); background: var(--soft-2); }
#tools button { border-color: transparent; }
#tools button:hover { border-color: var(--line); }
#tools button[aria-pressed="true"] { background: var(--soft-2); border-color: var(--accent); color: var(--accent); }
@media (pointer: coarse) { button, select { height: 44px; } button { min-width: 44px; } }
button[aria-pressed="true"] { border-color: var(--accent); }
button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; box-shadow: 0 0 0 5px var(--ring); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
:root[data-fx="off"] *, :root[data-fx="off"] *::before, :root[data-fx="off"] *::after { transition: none !important; animation: none !important; }
svg { display: block; }

#side { right: 16px; top: 68px; bottom: 112px; width: 328px; padding: 12px 14px; overflow: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
#side[hidden] { display: none; }
#side.detail-mode { display: flex; flex-direction: column; overflow: hidden; padding: 14px; }
#side h2 { margin: 12px 0 6px; font-size: 11px; color: var(--muted); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
#side h2:first-child { margin-top: 0; }
#rankView[hidden], #detail[hidden] { display: none; }
.rank { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.rank li { margin: 0; }
.row { position: relative; width: 100%; height: auto; min-height: 34px; padding: 5px 10px; border: 0; border-radius: 9px; overflow: hidden; justify-content: space-between; text-align: left; font: inherit; }
.row i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, var(--bar), var(--bar-b)); opacity: .26; z-index: 0; border-radius: 9px; transition: opacity var(--dur) var(--ease); }
.rank.pink .row i { background: linear-gradient(90deg, var(--pink), color-mix(in srgb, var(--pink) 40%, transparent)); }
.row span { position: relative; z-index: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row:hover { background: var(--soft); border-color: transparent; }
.row:hover i { opacity: .4; }
.rank li.sel .row { background: var(--soft-2); box-shadow: inset 0 0 0 1px var(--accent); }
.rank .n { font-variant-numeric: tabular-nums; font-weight: 700; overflow: visible; }
.rank .n small { font-weight: 400; color: var(--muted); }

/* 點選人物後的詳細面板：頭像＋名字 → 統計 → 合作對象／作品紀錄 */
#detail { display: flex; flex-direction: column; min-height: 0; flex: 1; gap: 12px; }
.dh { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.dh .back { height: 32px; padding: 0 12px 0 6px; font-size: 13px; color: var(--muted); border-radius: 999px; }
.kind { font-size: 12px; font-weight: 700; padding: 3px 12px; border-radius: 999px; border: 1px solid currentColor; letter-spacing: .04em; }
.kind.a { color: var(--pink-label); background: color-mix(in srgb, var(--pink) 12%, transparent); }
.kind.m { color: var(--accent); background: var(--soft); }
#side .dn { margin: 0; font-size: 22px; line-height: 1.25; font-weight: 700; overflow-wrap: anywhere; color: var(--text); letter-spacing: .01em; text-transform: none; }
#side .dn.a { color: var(--text); }
.dn { display: flex; align-items: center; gap: 14px; min-width: 0; }
.dn .avatar { width: 68px; height: 68px; flex: none; border-radius: 50%; object-fit: cover; border: 2px solid var(--pink); box-shadow: 0 0 0 4px color-mix(in srgb, var(--pink) 18%, transparent), 0 8px 24px -6px color-mix(in srgb, var(--pink) 60%, transparent); }
.dn:not(.a) .avatar { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent), 0 8px 24px -6px color-mix(in srgb, var(--accent) 60%, transparent); }
.dn .dn-name { min-width: 0; }
.stats { display: grid; grid-template-columns: 1fr 1fr 1.3fr; gap: 8px; margin: 0; }
.stats div { padding: 9px 10px 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--soft); min-width: 0; }
.stats dt { font-size: 11px; color: var(--muted); letter-spacing: .04em; }
.stats dd { margin: 3px 0 0; font-size: 20px; white-space: nowrap; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stats dd small { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 2px; }
.stats div:last-child dd { font-size: 16px; line-height: 1.55; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 12px; background: var(--soft); }
.seg button { height: 32px; border: 0; border-radius: 9px; font-size: 13px; color: var(--muted); }
.seg button:hover { background: transparent; color: var(--text); }
.seg button[aria-selected="true"] { background: var(--accent); color: #fff; font-weight: 700; box-shadow: 0 6px 16px -6px var(--accent); }
.modes { margin: 4px 0 6px; }
.modes button { height: 32px; min-width: 0; border: 0; border-radius: 9px; font-size: 13px; color: var(--muted); padding: 0 4px; }
.modes button:hover { background: transparent; color: var(--text); }
.modes button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: 700; box-shadow: 0 6px 16px -6px var(--accent); }
.hint { margin: 4px 0 6px; font-size: 12px; line-height: 1.55; color: var(--muted); }
.chk { display: flex; align-items: center; gap: 8px; padding: 8px 0 4px; color: var(--text); cursor: pointer; }
.chk input { width: 18px; height: 18px; accent-color: var(--accent); }
#modeBtn { font-weight: 800; font-size: 13px; min-width: 46px; letter-spacing: .04em; }
.dtool { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
.dtool .chips { display: flex; gap: 4px; }
.dtool button { height: 28px; min-width: 0; padding: 0 12px; font-size: 12px; border-radius: 999px; }
.dtool button[aria-pressed="true"] { border-color: var(--accent); background: var(--soft-2); color: var(--text); font-weight: 700; }
.dbody { flex: 1; min-height: 0; overflow: auto; margin: 0 -6px; padding: 0 6px 4px; scroll-padding: 40px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.plist, .wl { list-style: none; margin: 0; padding: 0; }
.plist { display: grid; gap: 2px; }
.prow { display: grid; grid-template-columns: 1fr auto; gap: 0 8px; width: 100%; height: auto; min-height: 46px; padding: 7px 10px; border: 0; border-radius: 10px; position: relative; overflow: hidden; text-align: left; font: inherit; justify-content: stretch; align-items: center; }
.prow i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, var(--bar), var(--bar-b)); opacity: .24; border-radius: 10px; transition: opacity var(--dur) var(--ease); }
.prow.pk i { background: linear-gradient(90deg, var(--pink), color-mix(in srgb, var(--pink) 35%, transparent)); }
.prow > span { position: relative; z-index: 1; min-width: 0; }
.prow .pn { font-weight: 600; overflow-wrap: anywhere; display: flex; align-items: center; gap: 9px; }
.prow .pn > span:last-child { min-width: 0; }
.prow .pn img, .prow .pn .avatar-slot { width: 26px; height: 26px; flex: none; border-radius: 50%; }
.prow .pn img { object-fit: cover; border: 1.5px solid color-mix(in srgb, var(--pink) 70%, transparent); }
.prow .pn .avatar-slot { visibility: hidden; }
.prow .pc { font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; }
.prow .ps { grid-column: 1 / -1; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.prow:hover { background: var(--soft); border-color: transparent; }
.prow:hover i { opacity: .38; }
.yr { position: sticky; top: 0; z-index: 2; margin: 0; padding: 10px 2px 5px; font-size: 12px; font-weight: 800; color: var(--muted); background: var(--panel-solid); letter-spacing: .08em; }
.yr small { font-weight: 500; margin-left: 6px; letter-spacing: 0; }
.wl li { display: grid; grid-template-columns: 1fr auto; gap: 1px 10px; padding: 7px 2px; border-bottom: 1px dashed var(--line); }
.wl b { font-variant-numeric: tabular-nums; font-size: 13px; letter-spacing: .03em; }
.wl .d { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; align-self: center; }
.wl .o { grid-column: 1 / -1; color: var(--text); font-size: 12px; opacity: .82; overflow-wrap: anywhere; }
.more { width: 100%; margin-top: 8px; height: 36px; font-size: 13px; color: var(--muted); border-radius: 999px; }
.empty-note { padding: 16px 4px; font-size: 13px; color: var(--muted); }
#empty { left: 50%; top: 45%; transform: translate(-50%, -50%); padding: 14px 18px; color: var(--muted); font-size: 14px; text-align: center; pointer-events: none; }
#empty[hidden] { display: none; }
#nogl { left: 50%; top: 45%; transform: translate(-50%, -50%); padding: 16px 20px; color: var(--text); font-size: 14px; text-align: center; max-width: min(420px, calc(100vw - 32px)); }
#nogl[hidden] { display: none; }

#settings { right: 16px; top: 68px; bottom: 112px; width: 288px; overflow: auto; z-index: 6; font-size: 13px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; transform-origin: 100% 0; }
#settings[hidden] { display: none; }
body.side-open #settings { right: 356px; }
#settings header { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 6px; padding: 9px 10px 9px 16px; background: var(--panel-solid); border-bottom: 1px solid var(--line); }
#settings header b { flex: 1; font-size: 14px; letter-spacing: .04em; }
#settings header button { height: 32px; min-width: 32px; padding: 0 6px; border-color: transparent; }
#settings details { border-bottom: 1px solid var(--line); padding: 4px 16px 10px; }
#settings details:last-child { border-bottom: 0; }
#settings summary { cursor: pointer; padding: 9px 0; min-height: 38px; font-weight: 700; color: var(--text); letter-spacing: .02em; }
.sl { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; padding: 5px 0; color: var(--muted); }
.sl output { font-variant-numeric: tabular-nums; color: var(--text); font-weight: 600; }
.sl input { grid-column: 1 / -1; width: 100%; margin: 0; }
#settings input[type="search"], #settings select { width: 100%; height: 34px; padding: 0 10px; background: transparent; color: var(--text); border: 1px solid var(--line); border-radius: 10px; font: inherit; margin: 4px 0; }
#aList { max-height: 190px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; padding: 4px 10px; margin-top: 4px; background: var(--soft); scrollbar-width: thin; }
#aList label { display: flex; gap: 8px; align-items: center; padding: 3px 0; color: var(--text); cursor: pointer; }
#aList input { accent-color: var(--accent); }
#aFind { margin-top: 8px; }
#aCnt { margin-left: auto; align-self: center; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
#aList label[hidden] { display: none; }
#aList .aka { font-size: 11px; color: var(--muted); }
#aList .none { padding: 8px 0; font-size: 12px; color: var(--muted); }
.dn a.ext { color: inherit; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 5px; text-decoration-thickness: 2px; transition: text-decoration-color var(--dur) var(--ease); }
.dn a.ext:hover { text-decoration-color: var(--accent); }
.dn a.ext svg { display: inline-block; margin-left: 6px; vertical-align: -2px; opacity: .7; }
.mini { display: flex; gap: 6px; margin-top: 6px; }
.mini button { height: 28px; font-size: 12px; border-radius: 999px; }

/* 自訂滑桿：進度會填色，滑鈕有光暈 */
input[type="range"] { -webkit-appearance: none; appearance: none; background: transparent; height: 24px; cursor: pointer; --p: 0%; }
input[type="range"]::-webkit-slider-runnable-track { height: 6px; border-radius: 999px; background: linear-gradient(90deg, var(--accent) var(--p), var(--track) var(--p)); }
input[type="range"]::-moz-range-track { height: 6px; border-radius: 999px; background: var(--track); }
input[type="range"]::-moz-range-progress { height: 6px; border-radius: 999px; background: var(--accent); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; margin-top: -5px; border-radius: 50%; background: #fff; border: 2px solid var(--accent); box-shadow: 0 0 0 4px var(--ring), 0 2px 8px rgba(0, 0, 0, .3); transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease); }
input[type="range"]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 2px solid var(--accent); box-shadow: 0 0 0 4px var(--ring); }
input[type="range"]:hover::-webkit-slider-thumb { transform: scale(1.12); }
input[type="range"]:active::-webkit-slider-thumb { transform: scale(1.2); box-shadow: 0 0 0 7px var(--ring), 0 2px 8px rgba(0, 0, 0, .3); }
@media (pointer: coarse) { input[type="range"] { height: 36px; } }

#legend { left: 16px; bottom: 112px; padding: 10px 14px; font-size: 12px; color: var(--muted); }
#legend .dots { display: flex; gap: 14px; align-items: center; margin-bottom: 4px; }
#legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; box-shadow: 0 0 10px currentColor; }
#legend .ramp { display: flex; align-items: center; gap: 8px; margin-top: 5px; }
#legend canvas { width: 120px; height: 14px; border-radius: 7px; }

#bar { left: 16px; right: 16px; bottom: 16px; padding: 10px 16px; display: grid; gap: 6px; }
#row { display: flex; align-items: center; gap: 10px; }
#row #play { min-width: 40px; background: var(--accent); border-color: transparent; color: #fff; box-shadow: 0 8px 20px -8px var(--accent); }
#row #play:hover { background: var(--accent); filter: brightness(1.1); }
#timeline { position: relative; flex: 1; min-width: 0; }
#slider { width: 100%; margin: 0; }
#ticks, #rcYears { position: relative; height: 16px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.yrs button { position: absolute; top: 0; transform: translateX(-50%); height: 16px; min-width: 14px; padding: 0 3px; border: 0; border-radius: 6px; background: none; color: inherit; font-size: inherit; line-height: 16px; }
.yrs button:hover, .yrs button:focus-visible { color: var(--accent); background: var(--soft); border: 0; }
.yrs button:active { transform: translateX(-50%); background: var(--soft-2); }
.yrs button.on { color: var(--accent); font-weight: 600; }
.yrs button.mini { min-width: 4px; width: 4px; padding: 0; font-size: 0; z-index: 1; }
.yrs button.mini::before { content: ""; width: 1px; height: 6px; background: currentColor; opacity: .55; }
.yrs button.mini:hover::before, .yrs button.mini.on::before { opacity: 1; height: 9px; }
#count { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; white-space: nowrap; }
#note { font-size: 12px; color: var(--muted); }

#tip { position: fixed; pointer-events: none; padding: 10px 12px; border-radius: 12px; font-size: 12px; max-width: 300px; z-index: 20; line-height: 1.55; }
#tip[hidden] { display: none; }
#tip b { font-size: 14px; }

/* 統計面板：長條圖競賽＋統計卡 */
#stats { position: fixed; inset: 0; z-index: 25; display: flex; flex-direction: column; gap: 10px; padding-block: max(14px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: radial-gradient(1100px 760px at 78% -12%, var(--bg-glow-a), transparent 62%), radial-gradient(900px 700px at -6% 108%, var(--bg-glow-b), transparent 58%), var(--bg); }
#stats[hidden], #raceView[hidden], #cardsView[hidden] { display: none; }
#stats .sh { display: flex; align-items: center; gap: 12px; }
#stats .sh b { font-size: 18px; }
#stats .sp { flex: 1; }
#raceView { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.rtools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.rseg button { height: 32px; min-width: 0; border: 0; border-radius: 9px; font-size: 13px; color: var(--muted); padding: 0 12px; }
.rseg button:hover { background: transparent; color: var(--text); }
.rseg button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: 700; box-shadow: 0 6px 16px -6px var(--accent); }
.rtools .rseg { margin: 0; }
#rcPlay { min-width: 84px; background: var(--accent); border-color: transparent; color: #fff; }

.scard { padding: 14px 16px 12px; display: grid; gap: 8px; align-content: start; min-width: 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); }
.scard h3 { margin: 0; font-size: 15px; }

.scard svg text.t { fill: var(--text); font-size: 12px; }

/* 黑洞轉場（切到 3D／4D）：蓋在畫布上、面板下 */
#bh { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
#bh[hidden] { display: none; }
#bh .bh-v { position: absolute; inset: 0; opacity: 0; background: radial-gradient(circle at var(--bx) var(--by), rgba(8, 4, 22, 0) 0, rgba(8, 4, 22, .38) 20%, rgba(5, 2, 14, .94) 78%); }
#bh .bh-core { position: absolute; left: var(--bx); top: var(--by); width: var(--d); height: var(--d); margin: calc(var(--d) / -2) 0 0 calc(var(--d) / -2); opacity: 0; transform: scale(0); }
#bh .bh-ring { position: absolute; inset: -22%; border-radius: 50%; background: conic-gradient(from 0deg, transparent 0 6%, var(--pink) 18%, #ffe3f3 27%, var(--accent-2) 42%, transparent 56% 68%, var(--accent) 84%, transparent 100%); -webkit-mask: radial-gradient(circle, transparent 50%, #000 57%, #000 64%, transparent 71%); mask: radial-gradient(circle, transparent 50%, #000 57%, #000 64%, transparent 71%); filter: blur(1.5px) saturate(1.5); }
#bh .bh-disc { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle, #000 0 62%, rgba(0, 0, 0, 0) 74%); box-shadow: 0 0 70px 16px rgba(165, 149, 255, .42), 0 0 160px 40px rgba(255, 95, 168, .22); }

/* 互動導覽：遮罩＋挖洞（box-shadow）＋說明卡 */
#tourVeil { position: fixed; inset: 0; z-index: 30; }
#tourVeil[hidden] { display: none; }
#tourVeil.dim { background: rgba(6, 5, 18, .62); }
#tourHole { position: fixed; border-radius: 14px; pointer-events: none; box-shadow: 0 0 0 100vmax rgba(6, 5, 18, .62), 0 0 0 2px var(--accent), 0 0 26px 2px var(--ring); transition: left .38s var(--ease), top .38s var(--ease), width .38s var(--ease), height .38s var(--ease); }
#tourHole.soft { box-shadow: 0 0 0 100vmax rgba(6, 5, 18, .3), 0 0 0 2px var(--accent), 0 0 26px 2px var(--ring); border-radius: 50%; }
#tourHole[hidden] { display: none; }
:root[data-fx="off"] #tourHole { transition: none; }
#tourCard { z-index: 31; width: min(400px, calc(100vw - 24px)); max-height: calc(100vh - 24px); overflow: auto; padding: 14px 18px 14px; display: grid; gap: 8px; }
#tourCard.wide { width: min(480px, calc(100vw - 24px)); }
#tourCard .tn { font-size: 11px; letter-spacing: .1em; color: var(--muted); display: flex; align-items: center; gap: 10px; }
#tourCard .tn i { flex: 1; height: 3px; border-radius: 3px; background: var(--track); overflow: hidden; }
#tourCard .tn i::after { content: ""; display: block; height: 100%; width: var(--p, 0%); background: linear-gradient(90deg, var(--accent), var(--pink)); border-radius: 3px; transition: width .35s var(--ease); }
#tourCard h2 { margin: 0; font-size: 17px; line-height: 1.35; text-wrap: balance; }
#tourCard .tb { font-size: 13.5px; line-height: 1.7; }
#tourCard .tb p { margin: 4px 0; }
#tourCard .tb ul { margin: 4px 0; padding-left: 18px; }
#tourCard .tb li { margin: 5px 0; }
#tourCard .tb b { color: var(--accent); font-weight: 650; }
#tourCard .tb .note { color: var(--muted); font-size: 12.5px; border-top: 1px solid var(--line); margin-top: 8px; padding-top: 8px; }
#tourCard .tb dl { margin: 4px 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; }
#tourCard .tb dt { font-weight: 650; color: var(--accent); white-space: nowrap; }
#tourCard .tb dd { margin: 0; }
#tourCard .tf { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
#tourCard .tf .sp { flex: 1; }
#tourCard .tf button.primary { background: var(--accent); border-color: transparent; color: #fff; min-width: 84px; }
#tourCard .tf button.primary:hover { filter: brightness(1.1); background: var(--accent); }
#tourCard .tf button.ghost { border-color: transparent; color: var(--muted); }
#tourCard .tf button[disabled] { opacity: .38; cursor: default; }
#tourHint { left: 50%; bottom: 128px; transform: translateX(-50%); z-index: 8; padding: 10px 12px 10px 16px; display: flex; align-items: center; gap: 10px; font-size: 13px; max-width: calc(100vw - 32px); }
#tourHint[hidden] { display: none; }
#tourHint button.primary { background: var(--accent); border-color: transparent; color: #fff; }
#tourHint button.ghost { border-color: transparent; color: var(--muted); }

@media (max-width: 700px) {
  #side { left: 16px; right: 16px; width: auto; top: 140px; bottom: 150px; }
  #settings, body.side-open #settings { left: 16px; right: 16px; width: auto; top: 140px; bottom: 150px; z-index: 6; }
  #legend { display: none; }
  /* 手機：標題卡獨佔一整列（日期＋當前作品），工具列放在它下面，面板從 140px 開始 */
  #card { top: 12px; left: 16px; right: 16px; max-width: none; padding: 8px 14px; display: flex; align-items: baseline; gap: 12px; }

</div>

<aside class="panel" id="side" aria-label="排行與詳細資料">
  <div id="rankView">
    <h2>女優（作品數／合作男優人數）</h2>

    <ol class="rank" id="rankM"></ol>
  </div>
  <div id="detail" hidden></div>
</aside>

<aside class="panel" id="settings" aria-label="設定" hidden>
  <header>
    <b>設定</b>
    <button type="button" id="setReset" aria-label="全部重設" title="全部重設">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    </button>
    <button type="button" id="setClose" aria-label="關閉設定" title="關閉">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>

  <details open><summary>檢視模式</summary>

      <button type="button" data-mode="2d">2D 平面</button>

    <label class="chk"><input type="checkbox" id="egoChk"> 選取時以他為原點排列（距離＝合作次數）</label>
    <label class="chk"><input type="checkbox" id="egoHideChk"> 原點排列時隱藏無關節點（不勾＝淡出到外圍）</label>
    <div id="viewExtra"><div id="g-view"></div><label class="chk"><input type="checkbox" id="spinChk"> 自動旋轉</label></div>

  <details open><summary>強度設定</summary><div id="g-strength"></div></details>
  <details open><summary>外觀設定</summary><div id="g-look"></div><label class="chk"><input type="checkbox" id="avatarChk"> 顯示大頭貼</label><label class="chk"><input type="checkbox" id="fxChk"> 動畫特效（開場、切換轉場、漣漪）</label><label class="chk"><input type="checkbox" id="holeChk"> 切到 3D／4D 時的黑洞轉場（需開啟動畫特效）</label></details>
  <details><summary>顯示過濾</summary>
    <input type="search" id="setSearch" list="nameList" placeholder="搜尋人名（選到會跳過去）" aria-label="搜尋人名">

    <div id="g-filter"></div>
    <input type="search" id="aFind" placeholder="模糊搜尋女優（漢字／假名／別名皆可）" aria-label="模糊搜尋女優" autocomplete="off">
    <div class="mini"><button type="button" id="aAll">女優全選</button><button type="button" id="aNone">全不選</button><span id="aCnt" aria-live="polite"></span></div>
    <div id="aList"></div>

        <option value="10">10×</option>
        <option value="30">30×</option>
        <option value="100">100×</option>

    <b>統計</b>

      <button type="button" id="rcRestart" aria-label="重播" title="重播">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>

<script>
(() => {
  const DATA = /*__DATA__*/null;
  const $ = (id) => document.getElementById(id);
  const root = document.documentElement;
  const works = DATA.works;
  const N = works.length;
  const sysReduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let reduce = sysReduce; // 系統要求減少動態，或使用者關掉「動畫特效」時為 true（見 applyFx）
  const FONT = '"Microsoft JhengHei","Yu Gothic","Noto Sans JP","Noto Sans TC",sans-serif';
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // ── 主題：沒手動選過就跟隨系統，手動切換後記住 ──
  const css = (name) => getComputedStyle(root).getPropertyValue(name).trim();
  const darkMQ = matchMedia("(prefers-color-scheme: dark)");
  let savedTheme = null;
  try { savedTheme = localStorage.getItem("graph-theme"); } catch (e) { /* 無儲存也能用 */ }
  root.dataset.theme = savedTheme === "dark" || savedTheme === "light" ? savedTheme : darkMQ.matches ? "dark" : "light";
  const dark = () => root.dataset.theme === "dark";
  const hexRgb = (c) => { const m = /#([0-9a-f]{6})/i.exec(c); const v = m ? parseInt(m[1], 16) : 0x888888; return [((v >> 16) & 255) / 255, ((v >> 8) & 255) / 255, (v & 255) / 255]; };
  const TH = {}; // 目前主題的顏色（讀一次，切換時才重讀）
  function readTheme() {
    for (const k of ["bg", "label", "accent", "pink", "pink-label", "muted", "line", "halo"]) TH[k] = css("--" + k);
    TH.dark = dark(); TH.pinkRGB = hexRgb(TH.pink);
  }
  readTheme();
  let onTheme = () => {};
  $("themeBtn").addEventListener("click", () => {
    root.dataset.theme = dark() ? "light" : "dark"; savedTheme = root.dataset.theme;
    try { localStorage.setItem("graph-theme", savedTheme); } catch (e) { /* ignore */ }
    onTheme();
  });
  if (darkMQ.addEventListener) darkMQ.addEventListener("change", (e) => { if (!savedTheme) { root.dataset.theme = e.matches ? "dark" : "light"; onTheme(); } });

  // ── 動效工具：anime.js（沒載入、或使用者要求減少動態時，全部直接跳到結果） ──
  const A = typeof anime !== "undefined" && anime.animate ? anime : null;
  let motion = !!A && !sysReduce;
  const tween = (o, key, to, dur, ease, delay = 0) => { if (!motion) { o[key] = to; return; } A.animate(o, { [key]: to, duration: dur, ease, delay }); };
  const fillRange = (el) => el.style.setProperty("--p", ((el.value - el.min) / ((el.max - el.min) || 1)) * 100 + "%");
  function staggerIn(els, max = 14) {
    if (!motion) return;
    const list = [...els].slice(0, max);
    if (list.length) A.animate(list, { opacity: [0, 1], translateY: [8, 0], duration: 360, ease: "outCubic", delay: A.stagger(18) });
  }
  function countUp(el) {
    const t = el.firstChild;
    if (!motion || !t || t.nodeType !== 3 || !/^\d+$/.test(t.nodeValue)) return;
    const to = +t.nodeValue, o = { v: 0 };
    t.nodeValue = "0";
    A.animate(o, { v: to, duration: 700, ease: "outExpo", onUpdate: () => { t.nodeValue = String(Math.round(o.v)); }, onComplete: () => { t.nodeValue = String(to); } });
  }
  // 點選人物後的詳細面板進場：標題列、統計、分頁依序滑入，頭像彈出，數字跳動
  function enterDetail(box) {
    if (!motion) return;
    A.animate(box.querySelectorAll(".dh,.dn,.stats,.seg,.dtool"), { opacity: [0, 1], translateY: [10, 0], duration: 420, ease: "outCubic", delay: A.stagger(45) });
    const av = box.querySelector(".avatar");
    if (av) A.animate(av, { scale: [0.5, 1], duration: 640, ease: "outBack", delay: 60 });
    for (const dd of box.querySelectorAll(".stats dd")) countUp(dd);
    staggerIn(box.querySelectorAll(".prow,.wl li"));
  }

  // ── 設定：滑桿定義、預設值、記住上次的值 ──
  const SPEC = [
    { g: "g-strength", k: "center", label: "節點集中強度", min: 0, max: 0.2, step: 0.005, def: 0.03, dp: 3, sim: true },
    { g: "g-strength", k: "repel", label: "節點間的互斥強度", min: 0, max: 4, step: 0.1, def: 1, dp: 1, sim: true },
    { g: "g-strength", k: "linkK", label: "節點間的連結強度", min: 0, max: 1.5, step: 0.01, def: 0.45, dp: 2, sim: true },
    { g: "g-strength", k: "dist", label: "連接線距離", min: 40, max: 500, step: 10, def: 170, dp: 0, sim: true },
    { g: "g-look", k: "nodeSize", label: "節點尺寸", min: 0.4, max: 2.5, step: 0.05, def: 1, dp: 2, sim: true, radius: true },
    { g: "g-look", k: "edgeW", label: "連接線寬度", min: 0.2, max: 3, step: 0.05, def: 1, dp: 2 },
    { g: "g-look", k: "textSize", label: "文字大小", min: 0.6, max: 2, step: 0.05, def: 1, dp: 2 },
    { g: "g-look", k: "textAlpha", label: "文字透明度", min: 0, max: 1, step: 0.05, def: 1, dp: 2 },
    { g: "g-look", k: "labelMax", label: "男優名稱顯示上限", min: 0, max: 500, step: 10, def: 220, dp: 0 },
    { g: "g-view", k: "timeH", label: "4D 時間軸長度", min: 200, max: 1800, step: 50, def: 900, dp: 0 },
    { g: "g-filter", k: "minLink", label: "連線最少合作次數", min: 1, max: 10, step: 1, def: 1, dp: 0, recount: true },
    { g: "g-filter", k: "minMale", label: "男優最少出現作品數", min: 1, max: 10, step: 1, def: 1, dp: 0, recount: true },
  ];
  const S = { speed: "1", hidden: [], mode: "2d", autoSpin: false, fx: true, showAvatars: true, ego: true, egoHide: false };
  for (const sp of SPEC) S[sp.k] = sp.def;
  try { Object.assign(S, JSON.parse(localStorage.getItem("graph-settings") || "{}")); } catch (e) { /* 無儲存也能用 */ }
  const saveSettings = () => { try { localStorage.setItem("graph-settings", JSON.stringify(S)); } catch (e) { /* ignore */ } };
  const hiddenA = new Set(S.hidden);
  let mode = ["2d", "3d", "4d"].includes(S.mode) ? S.mode : "2d"; // 2d 平面｜3d 力導向球雲｜4d 地面是關係圖、高度是首次合作時間

  // ── 圖結構：女優（粉）、男優（藍紫）、女優–男優連線（累計合作次數） ──
  const nodes = [];
  const byKey = new Map();
  const linkMap = new Map();
  const links = [];
  const AV = DATA.avatars || {};
  const avatarImages = {};
  for (const [name, src] of Object.entries(AV)) { const img = new Image(); img.src = src; avatarImages[name] = img; }
  let seed = 11;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  function node(kind, name) {
    const key = kind + ":" + name;
    let n = byKey.get(key);
    if (!n) {
      n = { kind, name, avatar: avatarImages[name], x: 0, y: 0, vx: 0, vy: 0, fx: null, fy: null, count: 0, shown: 0, alive: false, pulse: 0, dim: 0, ang: rnd() * Math.PI * 2, z: 0, vz: 0, dx: 0, dy: 0, dz: 0, di: 0, ft: 0.5, sx: 0, sy: 0, sk: 1, sd: 0, first: null, last: null, links: [], nbrs: new Set(), deg: 0, r: 8, perActress: null, hv: 0, sel: 0, rip: 0, mt: 1, ox: 0, oy: 0, oz: 0, pr: 0, pa: 0 };
      byKey.set(key, n);
      nodes.push(n);
    }
    return n;
  }
  const workLinks = [];
  for (const w of works) {
    const touched = [];
    for (const a of w.actresses) for (const m of w.males) {
      const A = node("A", a), M = node("M", m);
      const key = a + "\u0001" + m;
      let l = linkMap.get(key);
      if (!l) { l = { a: A, m: M, count: 0, shown: 0, pulse: 0, dim: 0 }; linkMap.set(key, l); links.push(l); A.links.push(l); M.links.push(l); A.nbrs.add(M); M.nbrs.add(A); }
      touched.push(l);
    }
    workLinks.push(touched);
  }
  const finalEdge = new Map();
  for (const t of workLinks) for (const l of t) finalEdge.set(l, (finalEdge.get(l) || 0) + 1);
  const MAXC = Math.max(1, ...finalEdge.values());
  // 靜態的首次／最後出現日（整份資料，不隨時間滑桿變動）：以選取者為原點排列時當時間座標
  works.forEach((w, i) => {
    for (const a of w.actresses) { const A = byKey.get("A:" + a); A.first0 = A.first0 || w.date; A.last0 = w.date; }
    for (const m of w.males) { const M = byKey.get("M:" + m); M.first0 = M.first0 || w.date; M.last0 = w.date; }
    for (const l of workLinks[i]) l.first0 = l.first0 || w.date;
  });

  const actresses = DATA.actresses.map((a) => a.name);
  $("title").textContent = actresses.length <= 2 ? `${actresses.join("、")} × 合作男優` : `${actresses.length} 位女優 × 合作男優`;
  $("maxLabel").textContent = `${MAXC} 次`;
  $("note").textContent = `共 ${DATA.total_works} 部作品，其中 ${DATA.with_males} 部查得到男優資料；次數是下限。`;
  $("slider").max = N;

  const T0 = Date.parse(works[0].date), TSPAN = Math.max(1, Date.parse(works[N - 1].date) - T0);
  const baseR = (n, c = n.count) => (n.kind === "A" ? Math.min(40, 14 + 3.2 * Math.sqrt(c)) : 5 + 2.6 * Math.sqrt(c)) * S.nodeSize;
  // 目標半徑。選了人之後改用「那個人的視角」：對方節點的大小＝跟選取者合作的次數，無關的節點縮小退到背景
  // 視角模式的尺度：最常合作的對象 = 最大，其餘依次數等比例縮小（差距要一眼看得出來，所以不用開根號）
  const PERSP_MIN = 4, PERSP_MAX = 78;
  let focusMax = 1;
  const linkOf = (f, n) => linkMap.get(f.kind === "A" ? f.name + "\u0001" + n.name : n.name + "\u0001" + f.name);
  const calcFocusMax = () => {
    focusMax = 1;
    const f = selected;
    if (!f || !f.alive) return;
    for (const l of f.links) if (l.vis && l.count > focusMax) focusMax = l.count;
  };
  const radius = (n) => {
    const f = selected;
    if (f && f.alive && n !== f) {
      if (f.nbrs.has(n)) {
        const l = linkOf(f, n);
        if (l && l.vis) return (PERSP_MIN + (PERSP_MAX - PERSP_MIN) * Math.pow(l.count / focusMax, 0.9)) * S.nodeSize;
      }
      return baseR(n) * 0.35;
    }
    return baseR(n);
  };
  const retarget = () => { calcFocusMax(); for (const n of nodes) n.rt = radius(n); };
  let idx = 0;
  let aliveList = [];
  let needReheat = 0;
  function recount(k) {
    for (const n of nodes) { n.count = 0; n.first = n.last = null; n.deg = 0; n.perActress = null; n.codes = []; n.wl = []; }
    for (const l of links) l.count = 0;
    for (let i = 0; i < k; i++) {
      const w = works[i];
      for (const t of workLinks[i]) t.count++;
      for (const a of w.actresses) { const A = byKey.get("A:" + a); A.count++; A.first = A.first || w.date; A.last = w.date; A.wl.push(w); }
      for (const m of w.males) {
        const M = byKey.get("M:" + m);
        M.count++; M.first = M.first || w.date; M.last = w.date; M.codes.push(w.code); M.wl.push(w);
        M.perActress = M.perActress || {};
        for (const a of w.actresses) M.perActress[a] = (M.perActress[a] || 0) + 1;
      }
    }
    for (const l of links) { l.vis = l.count >= S.minLink && !hiddenA.has(l.a.name); if (l.vis) { l.a.deg++; l.m.deg++; } }
    calcFocusMax();
    for (const n of nodes) {
      const should = n.kind === "A" ? n.count > 0 && !hiddenA.has(n.name) : n.count >= S.minMale && n.deg > 0;
      if (should && !n.alive) { spawn(n); needReheat = 0.5; }
      if (!should) n.alive = false;
      n.rt = radius(n);
      n.ft = n.first ? (Date.parse(n.first) - T0) / TSPAN : 0.5;
      if (!n.rv) { n.r = n.rt; n.rv = 1; }
    }
    aliveList = nodes.filter((n) => n.alive);
    $("empty").hidden = aliveList.length > 0 || k === 0;
  }
  // 新節點從已出現的鄰居旁邊冒出來，沒有鄰居就從中心附近
  function spawn(n) {
    n.alive = true; n.vx = n.vy = 0;
    const nb = [...n.nbrs].find((x) => x.alive);
    const d = nb ? 60 + rnd() * 40 : 120 + rnd() * 120;
    n.x = (nb ? nb.x : 0) + Math.cos(n.ang) * d;
    n.y = (nb ? nb.y : 0) + Math.sin(n.ang) * d;
    n.z = (nb ? nb.z : 0) + (rnd() - 0.5) * d; n.vz = 0;
  }

  // ── WebGL 渲染層（Three.js）：節點與連線用實例化 quad，由 shader 負責光暈、頭像與抗鋸齒。
  //    座標是 CPU 算好的螢幕像素（見 project()），所以 2D／3D／4D 共用同一條管線；文字與 4D 導引仍畫在上層 2D canvas ──
  const AT_COLS = 20, AT_ROWS = 20, AT_CELL = 96;
  const GL = (() => {
    if (typeof THREE === "undefined") return null;
    let renderer;
    try { renderer = new THREE.WebGLRenderer({ canvas: $("gl"), alpha: true, antialias: false, premultipliedAlpha: true }); } catch (e) { return null; }
    renderer.setClearColor(0x000000, 0);
    const scene = new THREE.Scene(), ortho = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const V2 = (x, y) => new THREE.Vector2(x, y), V3 = () => new THREE.Vector3();

    // 頭像圖集：每格 96px，節點用格號取樣
    const atlas = document.createElement("canvas");
    atlas.width = AT_COLS * AT_CELL; atlas.height = AT_ROWS * AT_CELL;
    const actx = atlas.getContext("2d");
    const tex = new THREE.CanvasTexture(atlas);
    tex.generateMipmaps = true; tex.minFilter = THREE.LinearMipmapLinearFilter; tex.magFilter = THREE.LinearFilter;
    const slot = new Map();
    let dirty = false;
    const addAvatar = (name, img) => {
      if (slot.has(name) || slot.size >= AT_COLS * AT_ROWS) return;
      const i = slot.size;
      actx.drawImage(img, (i % AT_COLS) * AT_CELL, Math.floor(i / AT_COLS) * AT_CELL, AT_CELL, AT_CELL);
      slot.set(name, i); dirty = true;
    };

    const U = {
      uRes: { value: V2(1, 1) }, uDark: { value: 0 }, uGlowA: { value: 0.3 }, uTime: { value: 0 },
      uPink: { value: V3() }, uAccent: { value: V3() }, uBg: { value: V3() },
      uAtlas: { value: tex }, uGrid: { value: V2(AT_COLS, AT_ROWS) },
    };
    const blend = (m) => {
      m.transparent = true; m.depthTest = false; m.depthWrite = false; m.side = THREE.DoubleSide;
      m.blending = THREE.CustomBlending;
      m.blendSrc = THREE.OneFactor; m.blendDst = THREE.OneMinusSrcAlphaFactor;
      m.blendSrcAlpha = THREE.OneFactor; m.blendDstAlpha = THREE.OneMinusSrcAlphaFactor;
      return m;
    };
    const NDC = "gl_Position = vec4(px.x / uRes.x * 2.0 - 1.0, 1.0 - px.y / uRes.y * 2.0, 0.0, 1.0);";

    // 星塵：深色是淡淡的星點，淺色幾乎看不見；隨平移／旋轉做一點視差
    const sg = new THREE.BufferGeometry(), sp = new Float32Array(240 * 3);
    for (let i = 0; i < sp.length; i++) sp[i] = Math.random();
    sg.setAttribute("position", new THREE.BufferAttribute(sp, 3));
    const starU = { uRes: U.uRes, uOff: { value: V2(0, 0) }, uTime: { value: 0 }, uPx: { value: 1 }, uCol: { value: V3() }, uK: { value: 1 } };
    const stars = new THREE.Points(sg, blend(new THREE.ShaderMaterial({
      uniforms: starU,
      vertexShader: `
        uniform vec2 uRes; uniform vec2 uOff; uniform float uTime; uniform float uPx;
        varying float vA;
        void main() {

          vec2 px = p * uRes;
          ${NDC}
          gl_PointSize = (1.0 + 2.2 * position.z) * uPx;
          vA = (0.3 + 0.7 * position.z) * (0.75 + 0.25 * sin(uTime * (0.6 + position.z * 1.4) + position.x * 40.0));
        }`,
      fragmentShader: `
        uniform vec3 uCol; uniform float uK; varying float vA;
        void main() {
          float d = length(gl_PointCoord - 0.5) * 2.0;

          gl_FragColor = vec4(uCol * a, a);

    })));
    stars.frustumCulled = false; stars.renderOrder = 0;
    scene.add(stars);

    const mkGeo = (verts, cap, names) => {
      const g = new THREE.InstancedBufferGeometry();
      g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(verts), 3));
      g.setIndex([0, 1, 2, 0, 2, 3]);
      const arr = {};
      for (const nm of names) {
        const a = new THREE.InstancedBufferAttribute(new Float32Array(Math.max(1, cap) * 4), 4);
        a.setUsage(THREE.DynamicDrawUsage); g.setAttribute(nm, a); arr[nm] = a;
      }
      g.instanceCount = 0;
      return { g, arr };
    };
    const flush = (geo, count) => {
      geo.g.instanceCount = count;
      if (!count) return;
      for (const a of Object.values(geo.arr)) { a.clearUpdateRanges(); a.addUpdateRange(0, count * 4); a.needsUpdate = true; }
    };

    // 連線：一條帶狀 quad，寬度是像素；女優端帶一點粉色漸層，脈衝時底下多一層粉色光
    const edgeGeo = mkGeo([0, -1, 0, 1, -1, 0, 1, 1, 0, 0, 1, 0], links.length, ["eA", "eB", "eC"]);
    const edges = new THREE.Mesh(edgeGeo.g, blend(new THREE.ShaderMaterial({
      uniforms: U,
      vertexShader: `
        attribute vec4 eA; attribute vec4 eB; attribute vec4 eC;
        uniform vec2 uRes;
        varying float vAlong; varying float vAcross; varying float vHalf; varying vec4 vB; varying vec4 vC;
        void main() {
          vec2 p0 = eA.xy, p1 = eA.zw, dir = p1 - p0;
          float len = max(length(dir), 0.001); dir /= len;
          vec2 nrm = vec2(-dir.y, dir.x);
          float half_ = eB.x * 0.5 + 1.5 + eB.z * 5.0 * eB.w;
          vec2 px = mix(p0, p1, position.x) + nrm * position.y * half_;
          ${NDC}
          vAlong = position.x; vAcross = position.y * half_; vHalf = eB.x * 0.5; vB = eB; vC = eC;
        }`,
      fragmentShader: `
        uniform vec3 uPink;
        varying float vAlong; varying float vAcross; varying float vHalf; varying vec4 vB; varying vec4 vC;
        void main() {
          float a = abs(vAcross);
          float core = (1.0 - smoothstep(vHalf - 0.7, vHalf + 0.7, a)) * vB.y;
          vec3 col = mix(vC.rgb, uPink, vC.a * (1.0 - vAlong));
          float pw = vHalf + 4.0 * vB.w * vB.z;
          float ua = (1.0 - smoothstep(pw - 1.0, pw + 1.0, a)) * vB.z * 0.5;
          vec4 o = vec4(uPink * ua, ua);

          gl_FragColor = o;
        }`,
    })));
    edges.frustumCulled = false; edges.renderOrder = 1;
    scene.add(edges);

    // 節點：光暈＋圓盤（假球體高光）＋頭像＋脈衝環／焦點環
    const nodeGeo = mkGeo([-1, -1, 0, 1, -1, 0, 1, 1, 0, -1, 1, 0], nodes.length, ["iA", "iB", "iC", "iD"]);
    const nodeMesh = new THREE.Mesh(nodeGeo.g, blend(new THREE.ShaderMaterial({
      uniforms: U,
      vertexShader: `
        attribute vec4 iA; attribute vec4 iB; attribute vec4 iC; attribute vec4 iD;
        uniform vec2 uRes;
        varying vec2 vP; varying float vH; varying vec4 vA; varying vec4 vB; varying vec4 vC; varying vec4 vD;
        void main() {
          float h = iA.z * 1.9 + 22.0 * iD.x + 6.0;
          vec2 px = iA.xy + position.xy * h;
          ${NDC}
          vP = position.xy * h; vH = h; vA = iA; vB = iB; vC = iC; vD = iD;
        }`,
      fragmentShader: `
        uniform sampler2D uAtlas; uniform vec2 uGrid; uniform float uDark; uniform float uGlowA; uniform float uTime;
        uniform vec3 uPink; uniform vec3 uAccent;
        varying vec2 vP; varying float vH; varying vec4 vA; varying vec4 vB; varying vec4 vC; varying vec4 vD;
        void main() {
          // iB.y：≥0 頭像格號；-1 沒有頭像（畫玻璃剪影）；≤-2 一般圓點。iD.y：被選取者（原點）的玻璃環強度
          float r = vA.z, isA = vB.x, av = vB.y, ring = vB.z, f = clamp(vB.w, 0.0, 1.0), sk = vD.x, anc = vD.y;
          float d = length(vP);
          vec3 base = vC.rgb;
          float fh = f * (1.0 - anc);
          float bw = mix((r < 14.0 ? 1.0 : 1.7) + 1.1 * fh, 3.0, anc);
          float aa = 0.8;
          float disc = 1.0 - smoothstep(r - aa, r + aa, d);
          float inner = 1.0 - smoothstep(r - bw - aa, r - bw + aa, d);
          vec2 q = vP / max(r, 1.0);
          vec2 dir = vP / max(d, 0.001);
          vec3 nrm = vec3(q, sqrt(max(0.0, 1.0 - dot(q, q))));
          float diff = dot(nrm, normalize(vec3(-0.45, -0.6, 0.65)));
          vec3 body = base * (0.82 + 0.3 * diff) + vec3(1.0) * pow(max(diff, 0.0), 12.0) * mix(0.10, 0.22, uDark);
          float avOn = step(0.0, av) * step(5.0, r);
          // 沒有頭像的大圓：霧面玻璃底＋人形剪影，不再是一顆純色圓點
          float silOn = step(-1.5, av) * step(av, -0.5) * step(9.0, r);
          float e = 1.2 / max(r, 1.0);
          vec3 frost = base * (0.66 + 0.34 * (0.5 - 0.5 * q.y)) + vec3(1.0) * mix(0.05, 0.1, uDark);
          float head = 1.0 - smoothstep(0.27 - e, 0.27 + e, length(q - vec2(0.0, -0.22)));
          float shoulder = 1.0 - smoothstep(1.0 - 2.0 * e, 1.0 + 2.0 * e, length((q - vec2(0.0, 0.84)) / vec2(0.68, 0.54)));
          body = mix(body, mix(frost, mix(vec3(1.0), base, 0.22), max(head, shoulder) * 0.86), silOn);
          float ri = max(r - bw, 1.0);
          vec2 u = vP / ri * 0.5 + 0.5;
          float idx = max(av, 0.0), col = mod(idx, uGrid.x), row = floor(idx / uGrid.x);
          vec2 uv = vec2((col + 0.02 + 0.96 * clamp(u.x, 0.0, 1.0)) / uGrid.x, 1.0 - (row + 0.02 + 0.96 * clamp(u.y, 0.0, 1.0)) / uGrid.y);
          vec4 t = texture2D(uAtlas, uv);
          body = mix(body, t.rgb, t.a * avOn * (1.0 - smoothstep(ri - aa, ri + aa, d)));
          // 內緣 1px 高光（左上亮、右下淡），原點再加內陰影
          float lit = 0.5 + 0.5 * dot(dir, vec2(-0.6, -0.8));
          float band = smoothstep(r - 2.6, r - 1.2, d) * (1.0 - smoothstep(r - 1.2, r - 0.2, d)) * step(7.0, r);
          body += vec3(1.0) * band * lit * mix(0.28, 0.4, uDark) * (1.0 - anc);
          body *= 1.0 - anc * 0.4 * smoothstep(r - bw - 6.0, r - bw, d);
          vec3 rim = mix(vec3(1.0), mix(base, vec3(1.0), 0.5), uDark);
          vec3 glass = mix(uAccent * 0.8, vec3(1.0), lit * lit);
          vec3 discCol = mix(mix(mix(rim, uAccent, fh), glass, anc), body, inner);
          float gr = isA > 0.5 ? r * 0.7 + 6.0 : r * 0.4 + 3.0;
          float outside = max(d - r, 0.0);
          float glow = exp(-outside / gr * 2.4) * (isA > 0.5 ? 0.34 : 0.14) + fh * 0.4 * exp(-outside / (r * 0.5 + 6.0) * 2.0)
                     + anc * 0.24 * exp(-outside / (r * 0.9 + 10.0) * 2.0);
          glow *= (1.0 - disc) * (1.0 - smoothstep(vH * 0.72, vH, d));
          vec3 gcol = mix(isA > 0.5 ? uPink : base, uAccent, fh * 0.6);
          gcol = mix(gcol, uPink, anc);
          float rr = r + (14.0 * (1.0 - ring) + 3.0) * sk;
          float rm = (1.0 - smoothstep(0.0, 1.3, abs(d - rr) - 1.0)) * step(0.02, ring) * ring;
          vec3 rc = isA > 0.5 ? uPink : uAccent;
          vec4 o = vec4(gcol * glow, glow * uGlowA);
          // 外圈：1px 細環＋刻度，錐形漸層（accent→粉）慢速旋轉
          float ang = atan(vP.y, vP.x), w = 0.5 + 0.5 * cos(ang - uTime * 0.35);

        flash.left -= dt; if (flash.left <= 0) flash = null;
        else {
          c.globalAlpha = Math.min(1, flash.left / 600); c.textAlign = "right"; c.textBaseline = "alphabetic"; c.font = `700 14px ${FONT}`;
          const tw = c.measureText(flash.txt).width; c.fillStyle = TH.accent; rrect(c, w - 18 - tw - 24, 12, tw + 24, 30, 15); c.globalAlpha *= 0.22; c.fill();
          c.globalAlpha = Math.min(1, flash.left / 600); c.fillStyle = TH.label; c.fillText(flash.txt, w - 30, 32); c.globalAlpha = 1;
        }
      } else if (narrow) flash = null;
      // 軸線與刻度
      const step = niceStep(axis / 5);
      c.font = `11px ${FONT}`; c.textAlign = "center";
      for (let v = step; v < axis; v += step) {
        const x = padL + (v / axis) * bw;
        c.strokeStyle = TH.line; c.lineWidth = 1; c.beginPath(); c.moveTo(x, padT - 6); c.lineTo(x, h - padB); c.stroke();
        c.fillStyle = TH.muted; c.fillText(String(Math.round(v)), x, padT - 12);
      }
      c.strokeStyle = TH.muted; c.globalAlpha = .5; c.beginPath(); c.moveTo(padL, padT - 6); c.lineTo(padL, h - padB); c.stroke(); c.globalAlpha = 1;
      // 大字年份（放在右下角，很淡）
      c.textAlign = "right"; c.fillStyle = TH.label; c.globalAlpha = .13;
      c.font = `800 ${Math.min(150, h * 0.3)}px ${FONT}`; c.fillText(String(yy), w - 16, h - Math.min(150, h * 0.3) * 0.22 - 22);
      c.globalAlpha = .5; c.font = `700 ${Math.min(34, h * 0.07)}px ${FONT}`; c.fillText(`${mm} 月`, w - 20, h - 18); c.globalAlpha = 1;
      // 長條：由下往上畫，前幾名蓋在最上層
      for (let r = cur.length - 1; r >= 0; r--) {
        const e = cur[r];
        if (e.y > K + 0.6) continue;
        const a = e.y > K - 0.4 ? Math.max(0, K + 0.6 - e.y) : 1;
        const cy = padT + e.y * rowH + rowH / 2, len = Math.max(3, (e.v / axis) * bw), tip = padL + len;
        c.globalAlpha = a;
        const g = c.createLinearGradient(padL, 0, tip, 0); g.addColorStop(0, e.color + "66"); g.addColorStop(1, e.color);
        c.fillStyle = g; rrect(c, padL, cy - barH / 2, len, barH, barH * 0.28); c.fill();
        c.textAlign = "right"; c.textBaseline = "middle"; c.fillStyle = TH.label; c.font = `600 ${fs}px ${FONT}`;
        c.fillText(fit(c, e.name, padL - 14), padL - 10, cy);
        const ir = Math.min(barH * 0.62, 22);
        let after = tip + ir + 6;
        if (e.kind === "P") { icon(c, tip + ir * 0.9, cy, ir, e.m, "M", e.color); icon(c, tip, cy, ir, e.a, "A", e.color); after = tip + ir * 0.9 + ir + 6; }
        else icon(c, tip, cy, ir, e.name, e.kind, e.color);
        c.textAlign = "left"; c.textBaseline = "middle"; c.font = `700 ${fs + 1}px ${FONT}`; c.fillStyle = TH.label;
        c.fillText(String(Math.round(e.v)), after, cy);
        c.globalAlpha = 1;
      }
    }
    function syncUI() {
      const i = Math.min(D.nM - 1, Math.max(0, Math.floor(t)));
      $("rcSlider").value = i;
      const y = monthOf(i)[0];
      for (const b of $("rcYears").children) b.classList.toggle("on", +b.dataset.y === y);
      if (y !== lastYear) { lastYear = y; const lead = cur[0]; if (lead) $("rcLive").textContent = `${y} 年：${lead.name} 領先，${Math.round(lead.v)}`; }
      const label = rPlaying ? "暫停" : "播放";
      if ($("rcPlay").dataset.s !== label) {
        $("rcPlay").dataset.s = label; $("rcPlay").setAttribute("aria-label", label);
        $("rcPlay").innerHTML = `<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">${rPlaying ? '<path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/>' : '<path d="M8 5l11 7-11 7z"/>'}</svg>${label}`;
      }
    }
    function loop(now) {
      if (!statsOpen) { raf = 0; return; }
      const dt = Math.min(100, now - lastT); lastT = now;
      if (tab === "race") {
        if (rPlaying && !reduce) { t += (dt / 1000) * BASE * speed; if (t >= D.nM - 1) { t = D.nM - 1; rPlaying = false; } }
        draw(dt); syncUI();
      }
      raf = requestAnimationFrame(loop);
    }
    function setMetric(m) {
      metric = m; cur = D.sets[m]; for (const e of cur) e.y = -1;
      for (const b of document.querySelectorAll("#raceView [data-metric]")) b.setAttribute("aria-pressed", String(b.dataset.metric === m));
      snap = true; flash = null; leadName = ""; lastYear = 0; // 換主題：停在原本的時間點與播放狀態
    }
    function restart() { snap = true; lastYear = 0; flash = null; leadName = ""; if (reduce) { t = D.nM - 1; rPlaying = false; } else { t = 0; rPlaying = true; } }
    function jump(i) { t = Math.max(0, Math.min(D.nM - 1, i)); snap = true; }
    function buildYears() {
      const el = $("rcYears"); el.textContent = "";
      const width = el.clientWidth || box.clientWidth, minGap = (34 / Math.max(1, width)) * 100;
      let lastPct = -99;
      for (const y of D.years) {
        const i = Math.max(0, (y * 12 - D.m0)), pct = (i / (D.nM - 1)) * 100;
        const b = document.createElement("button"); b.type = "button"; b.dataset.y = y; b.dataset.i = i;
        b.title = b.ariaLabel = `跳到 ${y} 年`; b.textContent = y; b.style.left = pct + "%";
        if (pct - lastPct < minGap) b.className = "mini"; else lastPct = pct;
        el.append(b);
      }
    }
    $("rcYears").addEventListener("click", (e) => { const b = e.target.closest("button[data-i]"); if (b) jump(+b.dataset.i); });
    $("rcSlider").addEventListener("input", (e) => jump(+e.target.value));
    $("rcPlay").addEventListener("click", () => { if (t >= D.nM - 1) { jump(0); rPlaying = true; } else rPlaying = !rPlaying; });
    $("rcRestart").addEventListener("click", restart);
    $("rcSpeed").addEventListener("change", (e) => { speed = +e.target.value; });
    for (const b of document.querySelectorAll("#raceView [data-metric]")) b.addEventListener("click", () => setMetric(b.dataset.metric));
    addEventListener("resize", () => { if (statsOpen && D) { buildYears(); snap = true; } });

    // ── 統計卡 ──
    const X = (s) => String(s).replace(/[&<>]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[ch]));
    function seriesChart(rows, o) { // rows: [{y,a,b}]；a 一律畫長條，b 依 o.line 畫折線或第二組長條
      const Wd = 460, Ht = 210, L = 40, R = 40, T = 16, B = 24, iw = Wd - L - R, ih = Ht - T - B, n = rows.length, bw = iw / n;
      const ma0 = Math.max(1, ...rows.map((r) => r.a)), mb = o.line ? Math.max(1, ...rows.map((r) => r.b)) : 1;
      const ma = o.line ? ma0 : Math.max(ma0, ...rows.map((r) => r.b));
      let s = `<svg viewBox="0 0 ${Wd} ${Ht}" role="img" aria-label="${X(o.label)}">`;
      for (let g = 1; g <= 3; g++) { const y = T + ih * (1 - g / 3); s += `<line x1="${L}" x2="${Wd - R}" y1="${y}" y2="${y}" style="stroke:var(--line)"/>`; }
      rows.forEach((r, i) => {
        const x = L + i * bw, hA = (ih * r.a) / ma;
        if (o.line) s += `<rect x="${x + bw * 0.15}" y="${T + ih - hA}" width="${bw * 0.7}" height="${hA}" rx="2" style="fill:var(--accent);opacity:.85"><title>${r.y}：${r.a} ${o.unitA}</title></rect>`;
        else {
          const hB = (ih * r.b) / ma;
          s += `<rect x="${x + bw * 0.1}" y="${T + ih - hA}" width="${bw * 0.38}" height="${hA}" rx="1.5" style="fill:var(--pink)"><title>${r.y}：${r.a} ${o.unitA}</title></rect><rect x="${x + bw * 0.52}" y="${T + ih - hB}" width="${bw * 0.38}" height="${hB}" rx="1.5" style="fill:var(--accent)"><title>${r.y}：${r.b} ${o.unitB}</title></rect>`;
        }
        if (i % Math.ceil(n / 8) === 0 || i === n - 1) s += `<text x="${x + bw / 2}" y="${Ht - 6}" text-anchor="middle">${r.y}</text>`;
      });
      if (o.line) {
        const pts = rows.map((r, i) => [L + i * bw + bw / 2, T + ih * (1 - r.b / mb)]);
        s += `<polyline points="${pts.map((p) => p.join(",")).join(" ")}" fill="none" stroke-width="2" style="stroke:var(--pink)"/>` + pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="2.6" style="fill:var(--pink)"><title>${rows[i].y}：${rows[i].b} ${o.unitB}</title></circle>`).join("");
        s += `<text x="${Wd - R + 6}" y="${T + 4}" style="fill:var(--pink)">${mb} ${o.unitB}</text>`;
      }
      s += `<text x="${L - 6}" y="${T + 4}" text-anchor="end" style="fill:${o.line ? "var(--accent)" : "var(--muted)"}">${ma}</text></svg>`;
      return s;
    }
    function hbars(items, max, label) { // items: [{l, v, t}]
      const rh = 26, Wd = 460, L = 130, R = 124, iw = Wd - L - R;
      let s = `<svg viewBox="0 0 ${Wd} ${items.length * rh + 4}" role="img" aria-label="${X(label)}">`;
      items.forEach((it, i) => {
        const y = i * rh + 2, bwid = Math.max(3, (it.v / max) * iw);
        s += `<text class="t" x="${L - 8}" y="${y + 16}" text-anchor="end">${X(it.l.length > 11 ? it.l.slice(0, 11) + "…" : it.l)}</text><rect x="${L}" y="${y + 4}" width="${bwid}" height="${rh - 9}" rx="4" style="fill:${i % 2 ? "var(--accent)" : "var(--pink)"};opacity:.9"/><text x="${L + bwid + 6}" y="${y + 16}">${X(it.t)}</text>`;
      });
      return s + "</svg>";
    }
    let cardsDone = false;
    function renderCards() {
      if (cardsDone) return; cardsDone = true;
      const yFirst = D.years[0];
      const yy2 = (d) => d.slice(2, 4);
      const cards = [
        { h: "每年作品量與活躍女優數", svg: seriesChart(D.yearly, { line: true, unitA: "部", unitB: "位", label: "每年作品數與活躍女優數" }),
          p: `長條是當年的作品數（左軸）、折線是當年至少有一部作品的女優人數（右軸）。資料範圍是有男優資料的作品與其中 ${D.nA} 位女優，所以只代表「這張圖看得到的範圍」。` },
        { h: "每年的新面孔", svg: seriesChart(D.faces, { line: false, unitA: "位女優", unitB: "位男優", label: "每年新出現的女優與男優" }) + `<p style="margin:0;font-size:12px"><span style="color:var(--pink)">■</span> 新女優　<span style="color:var(--accent)">■</span> 新男優</p>`,
          p: `每年第一次出現的人數。女優＝她在收錄資料裡的第一部作品；男優＝他第一次和這些女優合作（不一定是他真正的出道年）。${yFirst} 年是資料起點，所以最早那年會偏多。` },
        { h: "生涯長度前 10", svg: hbars(D.career.map((r) => ({ l: r.n, v: r.months, t: `${(r.months / 12).toFixed(1)} 年（${yy2(r.f)}–${yy2(r.l)}）` })), D.career[0].months, "女優生涯長度前十名"),
          p: "從收錄資料裡第一部到最後一部作品的時間差（括號內是起訖年份的後兩碼）。最後一部若是預告中的作品，日期可能比今天晚。" },
        { h: "橋樑男優前 10", svg: hbars(D.bridge.map((r) => ({ l: r.n, v: r.c, t: `${r.c} 位女優・${r.w} 部` })), D.bridge[0].c, "合作過最多女優的男優前十名"),
          p: "合作過最多位不同女優的男優。他們像橋一樣，把原本各自一群的女優串成同一張大圖。" },
      ];
      $("cardGrid").innerHTML = cards.map((c) => `<article class="scard"><h3>${X(c.h)}</h3>${c.svg}<p>${X(c.p)}</p></article>`).join("");
    }

    // ── 開關面板 ──
    function setTab(name) {
      tab = name;
      for (const b of document.querySelectorAll('#stats [role="tab"]')) b.setAttribute("aria-selected", String(b.dataset.tab === name));
      $("raceView").hidden = name !== "race"; $("cardsView").hidden = name !== "cards";
      if (name === "cards") renderCards(); else { snap = true; buildYears(); }
    }
    function openStats() {
      if (statsOpen) return;
      if (!D) { build(); cur = D.sets[metric]; t = D.nM - 1; snap = true; $("rcSlider").max = D.nM - 1; $("rcNote").textContent = `資料範圍：有男優資料的 ${N} 部作品、${D.nA} 位女優；次數是已知作品的下限。`; }
      statsOpen = true; $("stats").hidden = false; $("statsBtn").setAttribute("aria-pressed", "true"); document.body.classList.add("stats-open");
      setTab(tab); lastT = performance.now(); if (!raf) raf = requestAnimationFrame(loop);
      if (motion) A.animate($("stats"), { opacity: [0, 1], duration: 260, ease: "outCubic" });
      document.querySelector('#stats [role="tab"][aria-selected="true"]').focus({ preventScroll: true });
    }
    function closeStats() {
      if (!statsOpen) return;
      statsOpen = false; rPlaying = false; $("stats").hidden = true; $("statsBtn").setAttribute("aria-pressed", "false"); document.body.classList.remove("stats-open"); $("statsBtn").focus({ preventScroll: true });
    }
    $("statsBtn").addEventListener("click", () => (statsOpen ? closeStats() : openStats()));
    // 統計開著時，工具列其他按鈕（模式、排行、置中、設定）＝先回到圖再執行；深淺色切換就地生效
    $("tools").addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (statsOpen && b && ["modeBtn", "rankBtn", "fitBtn", "setBtn"].includes(b.id)) closeStats();
    }, true);
    for (const b of document.querySelectorAll('#stats [role="tab"]')) b.addEventListener("click", () => setTab(b.dataset.tab));
    addEventListener("keydown", (e) => {
      if (!statsOpen) return;
      if (e.key === "Escape") closeStats();
      else if (tab === "race" && e.key === " " && !(document.activeElement instanceof HTMLButtonElement)) $("rcPlay").click();
      else if (tab === "race" && e.key === "ArrowRight") jump(Math.floor(t) + 1);
      else if (tab === "race" && e.key === "ArrowLeft") jump(Math.floor(t) - 1);
      else return;
      e.preventDefault(); e.stopImmediatePropagation();
    }, true);
    onTheme = ((prev) => () => { prev(); if (statsOpen) snap = true; })(onTheme);
    // 測試掛勾：回傳指定月份（0 起算）時各主題的前 n 名與數值
    window.__graph.race = {
      get nM() { return D && D.nM; },
      get m0() { return D && D.m0; },
      top(m, i, n) { if (!D) build(); return D.sets[m].map((e) => ({ name: e.name, v: e.arr[i] })).sort((a, b) => b.v - a.v || (a.name < b.name ? -1 : 1)).slice(0, n); },
      get t() { return t; }, setT: (v) => jump(v), pause: () => { rPlaying = false; }, metric: () => metric,
    };
  }

  requestAnimationFrame(frame);
})();
</script>
